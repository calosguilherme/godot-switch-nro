# O Batida Capixaba no Switch. Com esta configuração, `python gsn.py gerar <pasta do jogo>` gera a mesma
# entrega que o jogo usa: sdmc:/switch/batida/ com batida.nro, batida.vulkan e batida.pck.
[jogo]
projeto_nome = Batida Capixaba
titulo = Batida Capixaba
autor = Batida Capixaba
arquivo = batida
# a versão sobe a cada entrega (pedido do criador) e vai também ao .pck: no Modo DEV o jogo mostra
# ".nro X · .pck Y" e "≠" quando os dois não batem (lê res://versao_switch.txt e Switch.versao())
versao_arquivo = VERSAO
subir_versao = sim
escrever_versao_em = res://versao_switch.txt
# o ícone de sempre (o tambor); a abertura é a do jogo (abertura.py a desenha a partir do ícone)
icone = icone.jpg
abertura = res://abertura_switch.png
# o preset "Switch" do jogo (inclui os JSON do conteúdo, dos idiomas e do palco e o versao_switch.txt)
preset = Switch
vulkan = sim
godot = ~/Desktop/Godot_v4.7.2-stable_win64.exe/Godot_v4.7.2-stable_win64_console.exe
